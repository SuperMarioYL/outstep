<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Outstep architecture: battery -> harness <-> model, harness -> tool stubs -> observer -> report">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <!-- static connectors -->
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="210" y1="190" x2="355" y2="190" marker-end="url(#ah-d)"/>
    <line x1="525" y1="190" x2="670" y2="190" marker-end="url(#ah-d)"/>
    <line x1="440" y1="150" x2="440" y2="92" marker-end="url(#ah-d)"/>
    <line x1="440" y1="230" x2="440" y2="263" marker-end="url(#ah-d)"/>
  </g>

  <!-- marching-dash data flow on the two horizontal connectors -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="210" y1="190" x2="349" y2="190" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="525" y1="190" x2="664" y2="190" stroke="#2DC79A" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="150" x2="440" y2="95" stroke="#2DC79A" stroke-opacity="0.45" stroke-dasharray="5 8">
      <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.6s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="440" y1="230" x2="440" y2="263" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="5 8">
      <animate attributeName="stroke-dashoffset" from="26" to="0" dur="1.6s" begin="-1.2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- data packets -->
  <g>
    <circle r="3.5" fill="#4DA3FF">
      <animateMotion path="M210,190 L349,190" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.5" fill="#2DC79A">
      <animateMotion path="M525,190 L664,190" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M440,150 L440,95" dur="2s" begin="-0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2s" begin="-0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M440,230 L440,263" dur="1.6s" begin="-1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes (breathing) -->
  <g>
    <rect x="40" y="150" width="170" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="125" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#8985FF">Battery v1</text>
    <text x="125" y="206" text-anchor="middle" font-size="11" fill="#A1A1A8">12 canary scenarios</text>

    <rect x="355" y="150" width="170" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#4DA3FF">Harness</text>
    <text x="440" y="206" text-anchor="middle" font-size="11" fill="#A1A1A8">tool-calling loop</text>

    <rect x="670" y="150" width="170" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="755" y="186" text-anchor="middle" font-size="15" font-weight="600" fill="#2DC79A">Observer → Report</text>
    <text x="755" y="206" text-anchor="middle" font-size="11" fill="#A1A1A8">ContainmentReport</text>

    <rect x="355" y="40" width="170" height="52" rx="13" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-0.6s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="71" text-anchor="middle" font-size="13" font-weight="600" fill="#2DC79A">Model endpoint</text>

    <rect x="355" y="263" width="170" height="52" rx="13" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.7s"
               calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="440" y="287" text-anchor="middle" font-size="13" font-weight="600" fill="#8985FF">Tool stubs</text>
    <text x="440" y="304" text-anchor="middle" font-size="10" fill="#A1A1A8">file · shell · http</text>
  </g>
</svg>
